plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.apptheme'
version = '1.0.0'

android {
  namespace 'expo.modules.apptheme'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
