plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundmonitor'
version = '1.0.0'

android {
  namespace 'expo.modules.backgroundmonitor'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':expo-background-task')
  implementation 'androidx.core:core-ktx:1.13.1'
  testImplementation 'junit:junit:4.13.2'
}
